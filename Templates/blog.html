{% extends "base.html" %}

{% block content %}

{% for message in get_flashed_messages() %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-labels="Close"></button>
    </div>
{% endfor %}  

<h1>Blog Posts...</h1>
<br/>

{% for post in posts %}
<div class="shadow p-3 mb-5 bg-body rounded">
    {{ post.date_created}}</small> <br/><br/>
    <h2>{{ post.title}}</h2>
    {{ post.content}}<br/><br/>
    
</div>
<br/>
{% endfor %}

{% endblock %}
